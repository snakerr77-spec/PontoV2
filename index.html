<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ponto</title>
    <!-- Caminho relativo usando ./ para evitar erro de tela branca no GitHub Pages -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Registro de Ponto ⏱️</h1>
        <div id="relogio">00:00:00</div>
        
        <div class="botoes">
            <button id="btnEntrada" onclick="registrarPonto('Entrada')">Registrar Entrada</button>
            <button id="btnSaida" onclick="registrarPonto('Saída')">Registrar Saída</button>
        </div>

        <div id="historico">
            <h3>Histórico de Hoje</h3>
            <ul id="listaHistorico"></ul>
        </div>
    </div>

    <!-- Script carregado no final para garantir que o HTML já existe -->
    <script src="./script.js"></script>
</body>
</html>
